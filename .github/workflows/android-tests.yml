name: Android Tests

on:
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-36'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  instrumentation-tests:
    name: Android instrumentation tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-36'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Enable KVM for the emulator
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run Compose instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics'
          script: cd android-app && ./gradlew connectedDebugAndroidTest --no-daemon
